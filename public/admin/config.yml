# Espace de rédaction CIRS-Conseil Inc. (Decap CMS) — accessible sur /admin/
# Connexion par e-mail et mot de passe via DecapBridge : la personne qui rédige n'a besoin d'aucun compte GitHub.
# Chaque publication crée un commit sur la branche main ; Vercel remet le site en ligne automatiquement.
# Mise en service : voir GUIDE-ARTICLES.md, partie 1.
backend:
  name: git-gateway
  repo: AbOky2/cirs
  branch: main
  # Identifiant du site sur DecapBridge (tableau de bord → site → configuration).
  identity_url: https://auth.decapbridge.com/sites/65bbc481-5b46-483e-9afa-fea8215ec364
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "Article : publier « {{slug}} » — {{author-name}}"
    update: "Article : modifier « {{slug}} » — {{author-name}}"
    delete: "Article : supprimer « {{slug}} » — {{author-name}}"
    uploadMedia: "Article : ajouter l’image {{path}} — {{author-name}}"
    deleteMedia: "Article : retirer l’image {{path}} — {{author-name}}"

locale: fr
site_url: https://cirsconseil.org
display_url: https://cirsconseil.org
logo_url: /cirs-logo.png
media_folder: public/images/articles
public_folder: /images/articles

# Adresses d'articles sans accents ni caractères spéciaux : « Écosystème » → ecosysteme.
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: articles
    label: Articles
    label_singular: Article
    description: Rédigez, modifiez et publiez les articles de la rubrique Articles du site.
    folder: content/articles
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}{{draft | ternary(' (brouillon)', '')}}"
    sortable_fields: [date, title, category]
    preview_path: articles/{{slug}}/
    fields:
      - {name: title, label: Titre, widget: string}
      - {name: date, label: Date de publication, widget: datetime, time_format: false, date_format: "DD/MM/YYYY", format: "YYYY-MM-DD"}
      - name: category
        label: Rubrique
        widget: select
        default: Analyses stratégiques
        options: [Analyses stratégiques, Notes de politiques publiques, Notes stratégiques, Veille internationale, Perspectives CIRS-Conseil]
      - {name: summary, label: Résumé (affiché dans la liste), widget: text, required: false}
      - {name: author, label: Auteur, widget: string, default: Hassan Ahmat Djamaladine}
      - {name: cover, label: Image de couverture, widget: image, required: false}
      - {name: draft, label: Brouillon (non publié sur le site), widget: boolean, default: false, required: false}
      - {name: body, label: Texte de l’article, widget: markdown}
